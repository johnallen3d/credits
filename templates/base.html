<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"...","swap":true}]}'>
  <title>{% block title %}credits{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">credits</a>

    <a href="https://www.themoviedb.org/" rel="noopener"><img src="/static/tmdb-logo.svg" alt="TMDB" width="110" height="14"></a>

  </footer>
</body>
</html>
