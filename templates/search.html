{% extends "base.html" %}
{% block title %}{% if query.is_empty() %}credits{% else %}{{ query }} · credits{% endif %}{% endblock %}
{% block content %}
<form class="search" action="/" method="get" role="search"
      hx-get="/" hx-target="#results" hx-replace-url="true" hx-indicator="#loading"
      hx-trigger="submit, input changed delay:400ms from:#q">
  <label for="q" class="visually-hidden">Search movies, TV shows and people</label>
  <input id="q" name="q" type="search" value="{{ query }}" placeholder="Search movies, TV shows and people" autofocus autocomplete="off">
  <button type="submit">Search</button>
  <span id="loading" class="htmx-indicator" role="status">Searching…</span>
</form>
<div id="results" aria-live="polite">
{% include "_results.html" %}
</div>
<script>
// Arrow Up/Down in the search box selects a result (or recent tile); Enter opens it.
(() => {
  const q = document.getElementById("q");
  const results = document.getElementById("results");
  let index = -1;
  const items = () => [...results.querySelectorAll(".result a, .tiles a")];
  const select = (i) => {
    const list = items();
    list.forEach((a) => a.classList.remove("selected"));
    index = Math.max(-1, Math.min(i, list.length - 1));
    if (index >= 0) list[index].classList.add("selected");
    if (index >= 0) list[index].scrollIntoView({ block: "nearest" });
  };
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!items().length) return;
      e.preventDefault();
      select(index + (e.key === "ArrowDown" ? 1 : -1));
    } else if (e.key === "Enter" && index >= 0) {
      e.preventDefault();
      items()[index].click();
    }
  });
  // New results (or a changed query) start with nothing selected.
  q.addEventListener("input", () => select(-1));
  document.body.addEventListener("htmx:afterSwap", (e) => {
    if (e.detail.target === results) index = -1;
  });
})();
</script>
{% endblock %}
