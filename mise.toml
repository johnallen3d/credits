[tools]
rust = "1.93"
doppler = "latest"

[tasks.dev]
description = "Run the server on localhost with secrets from Doppler (credits/dev)"
run = "doppler run --project credits --config dev -- cargo run --bin credits-web"

[tasks.tui]
description = "Run the terminal client against the server in ~/.config/credits/config.toml"
run = "cargo run --bin credits"

[tasks.test]
description = "Run tests (no TMDB access needed)"
run = "cargo test"

[tasks.openapi]
description = "Regenerate openapi.json from the API routes"
run = "UPDATE_OPENAPI=1 cargo test --quiet --test openapi"

[tasks.hooks]
description = "Use the repo's git hooks (pre-commit keeps openapi.json current)"
run = "git config core.hooksPath .githooks"

[tasks."mac:build"]
description = "Build the macOS launcher (Option-Space search) into macos/build/Credits Launcher.app"
dir = "macos"
run = '''
swift build -c release
app="build/Credits Launcher.app"
rm -rf "$app" && mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
cp Info.plist "$app/Contents/"
cp AppIcon.icns "$app/Contents/Resources/"
cp "$(swift build -c release --show-bin-path)/CreditsLauncher" "$app/Contents/MacOS/"
codesign --force --sign - "$app"
'''

[tasks.mac]
description = "Build the macOS launcher and run it from macos/build"
depends = ["mac:build"]
run = '''
pkill -x CreditsLauncher || true
open "macos/build/Credits Launcher.app"
'''

# The Exact iOS spike in mobile/. Exact is a source checkout, not a package:
# mobile:setup clones it into mobile/.exact-sdk at the commit the app was built
# against.
[vars]
exact_rev = "30f725e5"
# John's free personal Apple team. Its installs expire after 7 days: rerun
# mobile:phone to renew.
ios_team = "96RT8K7VDR"

[tasks."mobile:setup"]
description = "Clone Exact into mobile/.exact-sdk and install its toolchains (Xcode 27.1+ for iOS)"
dir = "mobile"
tools = { bun = "1.4.2", rust = "1.99.1" }
env = { EXACT = "{{config_root}}/mobile/.exact-sdk", EXACT_FEEDBACK = "0" }
run = '''
[ -d "$EXACT/.git" ] || git clone https://github.com/expo/exact.git "$EXACT"
git -C "$EXACT" cat-file -e {{vars.exact_rev}} 2>/dev/null || git -C "$EXACT" fetch --unshallow origin
git -C "$EXACT" checkout --quiet {{vars.exact_rev}}
bun "$EXACT/scripts/exact.mjs" setup
'''

[tasks."mobile:proxy"]
description = "Serve the credits API with CORS on 127.0.0.1:8790, for the web dev loop (the app's sources read the hosted API)"
dir = "mobile"
tools = { bun = "1.4.2" }
run = "bun tools/cors-proxy.ts"

[tasks."mobile:web"]
description = "Run the Exact app's web dev loop"
dir = "mobile"
tools = { bun = "1.4.2", rust = "1.99.1" }
env = { EXACT = "{{config_root}}/mobile/.exact-sdk", EXACT_FEEDBACK = "0" }
run = "bun exact.mjs web"

[tasks."mobile:ios"]
description = "Build the Exact app and launch it on the booted iOS Simulator"
dir = "mobile"
tools = { bun = "1.4.2", rust = "1.99.1" }
env = { EXACT = "{{config_root}}/mobile/.exact-sdk", EXACT_FEEDBACK = "0" }
run = "bun exact.mjs ios --run"

[tasks."mobile:phone"]
description = "Build the Exact app and install it on the iPhone plugged in over USB (rerun weekly: free-team installs expire after 7 days)"
dir = "mobile"
tools = { bun = "1.4.2", rust = "1.99.1" }
env = { EXACT = "{{config_root}}/mobile/.exact-sdk", EXACT_FEEDBACK = "0", DEVELOPMENT_TEAM = "{{vars.ios_team}}" }
run = "bun exact.mjs ios --device --run"

[tasks."mobile:verify"]
description = "Run Exact's checks on the app: tests, layout, accessibility, relaunch"
dir = "mobile"
tools = { bun = "1.4.2", rust = "1.99.1" }
env = { EXACT = "{{config_root}}/mobile/.exact-sdk", EXACT_FEEDBACK = "0" }
run = "bun exact.mjs verify"
