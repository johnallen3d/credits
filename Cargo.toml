[package]
name = "credits"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
jiff = { version = "0.2.38", features = ["serde"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
utoipa = { version = "6.0.0", features = ["macros", "axum_extras", "jiff_0_2", "preserve_order", "preserve_path_order"] }
utoipa-axum = "0.3.0"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
