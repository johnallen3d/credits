[package]
name = "credits"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
