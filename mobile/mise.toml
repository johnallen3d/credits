# The Exact spike: Exact is a source checkout, not a package, so `exact:fetch`
# clones it into .exact-sdk at the commit this app was built against.
[tools]
bun = "1.4.2"
rust = "1.99.1"

[vars]
exact_rev = "30f725e5"

[env]
EXACT = "{{config_root}}/.exact-sdk"

[tasks."exact:fetch"]
description = "Clone Exact into .exact-sdk at the pinned commit"
run = '''
[ -d "$EXACT/.git" ] || git clone https://github.com/expo/exact.git "$EXACT"
git -C "$EXACT" cat-file -e {{vars.exact_rev}} 2>/dev/null || git -C "$EXACT" fetch --unshallow origin
git -C "$EXACT" checkout --quiet {{vars.exact_rev}}
'''

[tasks.setup]
description = "Fetch Exact and install its toolchains (Xcode 27.1+ for iOS on a Mac)"
depends = ["exact:fetch"]
run = "bun \"$EXACT/scripts/exact.mjs\" setup"

[tasks.proxy]
description = "Serve the credits API with CORS on 127.0.0.1:8790 (the app's sources read it)"
run = "bun tools/cors-proxy.ts"

[tasks.web]
description = "Web dev loop"
run = "bun exact.mjs web"

[tasks.ios]
description = "Build and launch on the booted iOS Simulator"
run = "bun exact.mjs ios --run"

[tasks.verify]
description = "Exact's checks: tests, layout, accessibility, relaunch"
run = "bun exact.mjs verify"
