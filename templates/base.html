<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"...","swap":true}]}'>
  <title>{% block title %}credits{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>try { var t = localStorage.getItem("credits-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/app.css?v={{ crate::web::APP_CSS_VERSION }}">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><img src="/static/favicon.svg" alt="credits" width="32" height="32"></a>
    <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="main-nav" hidden>
      <svg class="icon-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span class="visually-hidden">Menu</span>
    </button>
    <nav id="main-nav" class="site-nav" aria-label="Main">
      <a href="/watchlist">To watch</a>
      <a href="/favorites">Favorites</a>
      <a href="/watched">Watched</a>
      <a href="/now-playing">Now playing</a>
      <a href="/coming-soon">Coming soon</a>
    </nav>
    <script>
      // Marks the current page; on narrow screens the links fold behind a menu
      // button. Without JavaScript they wrap instead.
      (function () {
        var header = document.querySelector("header.site");
        var toggle = header.querySelector(".menu-toggle");
        var current = header.querySelector('.site-nav a[href="' + location.pathname + '"]');
        if (current) current.setAttribute("aria-current", "page");
        function open(opened) {
          header.classList.toggle("menu-open", opened);
          toggle.setAttribute("aria-expanded", String(opened));
        }
        toggle.addEventListener("click", function () { open(!header.classList.contains("menu-open")); });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && header.classList.contains("menu-open")) { open(false); toggle.focus(); }
        });
        document.addEventListener("click", function (e) { if (!header.contains(e.target)) open(false); });
        // A back/forward-cache restore comes back with the menu closed.
        window.addEventListener("pageshow", function () { open(false); });
        header.classList.add("has-menu");
        toggle.hidden = false;
      })();
    </script>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Long biographies and overviews collapse to about the poster's height
    // (at least eight lines) behind Show more; without JavaScript they show whole.
    document.querySelectorAll("[data-collapsible]").forEach(function (box) {
      var line = parseFloat(getComputedStyle(box).lineHeight) || 24;
      var body = box.closest(".detail-body");
      var poster = body && body.querySelector(".poster.large");
      var beside = poster ? poster.getBoundingClientRect().bottom - box.getBoundingClientRect().top : 0;
      var limit = Math.max(8 * line, beside);
      // Not worth hiding just a few lines.
      if (box.scrollHeight <= limit + 3 * line) return;
      var button = document.createElement("button");
      button.type = "button";
      button.className = "show-more";
      function collapse(collapsed) {
        box.classList.toggle("collapsed", collapsed);
        box.style.maxHeight = collapsed ? limit + "px" : "";
        button.textContent = collapsed ? "Show more" : "Show less";
        button.setAttribute("aria-expanded", String(!collapsed));
      }
      button.addEventListener("click", function () { collapse(!box.classList.contains("collapsed")); });
      collapse(true);
      box.after(button);
    });

    // Photos and posters open full size over the page; the smaller copy
    // already shown fills in until the original loads, or if it can't.
    (function () {
      var images = document.querySelectorAll("img[data-full]");
      if (!images.length || !window.HTMLDialogElement) return;
      var dialog = document.createElement("dialog");
      dialog.className = "lightbox";
      dialog.innerHTML = '<button type="button" class="lightbox-close" aria-label="Close">×</button><img alt="">';
      var big = dialog.querySelector("img");
      dialog.addEventListener("click", function () { dialog.close(); });
      document.body.append(dialog);
      images.forEach(function (img) {
        img.tabIndex = 0;
        img.setAttribute("role", "button");
        img.title = "View full size";
        function open() {
          big.src = img.currentSrc || img.src;
          big.alt = img.alt;
          var full = new Image();
          full.onload = function () { big.src = full.src; };
          full.src = img.dataset.full;
          dialog.showModal();
        }
        img.addEventListener("click", open);
        img.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
        });
      });
    })();
  </script>
  <footer class="site">
    <nav class="site-nav" aria-label="Site">
      <a href="/services">My services</a>
      <a href="/playback">Seen on Apple TV</a>
      <a href="/about">About</a>
      <label class="theme-picker" hidden>Theme
        <select id="theme">
          <option value="rose-pine">Rosé Pine</option>
          <option value="tokyo-night">Tokyo Night</option>
          <option value="catppuccin">Catppuccin</option>
          <option value="classic">Classic</option>
        </select>
      </label>
    </nav>
    <script>
      // Remembered per browser; without JavaScript the default theme shows.
      (function () {
        var select = document.getElementById("theme");
        var current = document.documentElement.dataset.theme;
        if (current && select.querySelector('option[value="' + current + '"]')) select.value = current;
        select.addEventListener("change", function () {
          document.documentElement.dataset.theme = select.value;
          try { localStorage.setItem("credits-theme", select.value); } catch (e) {}
        });
        select.parentElement.hidden = false;
      })();
    </script>
  </footer>
</body>
</html>
