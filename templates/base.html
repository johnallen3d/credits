<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"...","swap":true}]}'>
  <title>{% block title %}credits{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script>try { var t = localStorage.getItem("credits-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/app.css?v={{ crate::web::APP_CSS_VERSION }}">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site">
    <a class="brand" href="/"><img src="/static/favicon.svg" alt="credits" width="32" height="32"></a>
    <nav class="site-nav" aria-label="Main">
      <a href="/watchlist">To watch</a>
      <a href="/favorites">Favorites</a>
      <a href="/watched">Watched</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Long biographies and overviews collapse to about the poster's height
    // (at least eight lines) behind Show more; without JavaScript they show whole.
    document.querySelectorAll("[data-collapsible]").forEach(function (box) {
      var line = parseFloat(getComputedStyle(box).lineHeight) || 24;
      var body = box.closest(".detail-body");
      var poster = body && body.querySelector(".poster.large");
      var beside = poster ? poster.getBoundingClientRect().bottom - box.getBoundingClientRect().top : 0;
      var limit = Math.max(8 * line, beside);
      // Not worth hiding just a few lines.
      if (box.scrollHeight <= limit + 3 * line) return;
      var button = document.createElement("button");
      button.type = "button";
      button.className = "show-more";
      function collapse(collapsed) {
        box.classList.toggle("collapsed", collapsed);
        box.style.maxHeight = collapsed ? limit + "px" : "";
        button.textContent = collapsed ? "Show more" : "Show less";
        button.setAttribute("aria-expanded", String(!collapsed));
      }
      button.addEventListener("click", function () { collapse(!box.classList.contains("collapsed")); });
      collapse(true);
      box.after(button);
    });
  </script>
  <footer class="site">
    <nav class="site-nav" aria-label="Site">
      <a href="/services">My services</a>
      <a href="/playback">Seen on Apple TV</a>
      <a href="/about">About</a>
      <label class="theme-picker" hidden>Theme
        <select id="theme">
          <option value="rose-pine">Rosé Pine</option>
          <option value="tokyo-night">Tokyo Night</option>
          <option value="catppuccin">Catppuccin</option>
          <option value="classic">Classic</option>
        </select>
      </label>
    </nav>
    <script>
      // Remembered per browser; without JavaScript the default theme shows.
      (function () {
        var select = document.getElementById("theme");
        var current = document.documentElement.dataset.theme;
        if (current && select.querySelector('option[value="' + current + '"]')) select.value = current;
        select.addEventListener("change", function () {
          document.documentElement.dataset.theme = select.value;
          try { localStorage.setItem("credits-theme", select.value); } catch (e) {}
        });
        select.parentElement.hidden = false;
      })();
    </script>
  </footer>
</body>
</html>
